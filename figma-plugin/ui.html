<!doctype html><html><head><meta charset="utf-8"><style>
:root{font:12px Inter,system-ui,sans-serif;color:var(--figma-color-text);background:var(--figma-color-bg)}*{box-sizing:border-box}body{margin:0;padding:16px}h1{font-size:18px;margin:0 0 4px}.muted{color:var(--figma-color-text-secondary);line-height:1.45}.scope{margin:16px 0 0}.scope label{display:block;margin-bottom:6px;font-weight:600}.scope select{width:100%;border:1px solid var(--figma-color-border);background:var(--figma-color-bg);color:inherit;border-radius:7px;padding:9px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 16px}button{border:1px solid var(--figma-color-border);background:var(--figma-color-bg-secondary);color:inherit;border-radius:7px;padding:10px;font-weight:600;cursor:pointer}button.primary{background:#e90044;color:white;border-color:#e90044}button:hover{filter:brightness(.97)}#status{padding:10px;border-radius:7px;background:var(--figma-color-bg-secondary);margin-bottom:12px;line-height:1.45}.ok{color:#18864b}.bad{color:#c63636}#issues{display:none;margin:0 0 12px;border:1px solid var(--figma-color-border);border-radius:7px;overflow:hidden}.issue{padding:10px;border-bottom:1px solid var(--figma-color-border);background:var(--figma-color-bg)}.issue:last-child{border-bottom:0}.issue-name{font-weight:600;margin-bottom:5px;word-break:break-word}.issue-message{color:#c63636;line-height:1.4}.issue button{margin-top:8px;padding:6px 9px;font-size:11px}textarea{width:100%;height:240px;border:1px solid var(--figma-color-border);border-radius:7px;background:var(--figma-color-bg);color:inherit;padding:10px;font:10px ui-monospace,SFMono-Regular,monospace;resize:vertical}</style></head><body>
<h1>AutoBanner Template Exporter</h1><div class="muted">Build, detect, validate, and export the complete semantic template collection.</div>
<div class="scope"><label for="scope">Template set</label><select id="scope"><option value="all">All templates</option></select><div class="muted" id="build-note">Loading template sets from this Figma file…</div></div>
<div class="actions"><button class="primary" id="build">Build all templates</button><button id="scan">Scan document</button><button id="validate">Validate</button><button id="copy">Copy JSON</button><button id="download">Export JSON</button></div>
<div id="status">Ready. Build creates 29 formats and 91 variants.</div><div id="issues" aria-live="polite"></div><textarea id="out" spellcheck="false" placeholder="Detected JSON will appear here"></textarea>
<script>
const status=document.getElementById('status'),issues=document.getElementById('issues'),out=document.getElementById('out'),scope=document.getElementById('scope'),buildNote=document.getElementById('build-note');let buildableSets=[];const send=type=>parent.postMessage({pluginMessage:{type,scope:scope.value}},'*');const requestTemplateSets=()=>parent.postMessage({pluginMessage:{type:'get-template-sets'}},'*');const exportFileName=()=>scope.value==='all'?'all-templates.json':scope.value.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'.json';const updateBuildUi=()=>{const all=scope.value==='all',buildable=all||buildableSets.includes(scope.value);build.disabled=!buildable;build.textContent=all?'Build all templates':buildable?'Build '+scope.value:'Custom set';buildNote.textContent=all?'Building all templates replaces every generated template page.':buildable?'Only the '+scope.value+' page will be replaced. Other template pages and refinements stay unchanged.':'This custom set can be scanned, validated, and exported. Build is disabled to preserve its Figma design.'};const setTemplateSets=(sets,currentPage,buildable)=>{const previous=scope.value;buildableSets=buildable||[];scope.replaceChildren(new Option('All templates','all'));sets.forEach(name=>scope.add(new Option(name+' only',name)));scope.value=sets.includes(previous)?previous:sets.includes(currentPage)?currentPage:'all';updateBuildUi()};scope.onchange=updateBuildUi;window.addEventListener('focus',requestTemplateSets);document.addEventListener('visibilitychange',()=>{if(!document.hidden)requestTemplateSets()});updateBuildUi();build.onclick=()=>{status.textContent=scope.value==='all'?'Building all templates…':'Building '+scope.value+' only…';send('build')};scan.onclick=()=>send('scan');validate.onclick=()=>send('validate');copy.onclick=async()=>{await navigator.clipboard.writeText(out.value);status.innerHTML='<span class="ok">JSON copied.</span>'};download.onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out.value],{type:'application/json'}));a.download=exportFileName();a.click();URL.revokeObjectURL(a.href)};
const renderIssues=validation=>{issues.replaceChildren();const rows=[];validation.forEach(item=>{item.errors.forEach(message=>rows.push({item,message,type:'error'}));item.warnings.forEach(message=>rows.push({item,message,type:'warning'}))});issues.style.display=rows.length?'block':'none';rows.forEach(({item,message,type})=>{const row=document.createElement('div');row.className='issue';const name=document.createElement('div');name.className='issue-name';name.textContent=item.name;const detail=document.createElement('div');detail.className=type==='error'?'issue-message':'muted';detail.textContent=message;const show=document.createElement('button');show.textContent='Show in Figma';show.onclick=()=>parent.postMessage({pluginMessage:{type:'focus-node',id:item.id}},'*');row.append(name,detail,show);issues.appendChild(row)})};
onmessage=e=>{const m=e.data.pluginMessage;if(!m)return;if(m.type==='template-sets'){setTemplateSets(m.sets||[],m.currentPage,m.buildable||[]);return}if(m.type==='error'){status.textContent=m.message;status.className='bad';return}if(m.type==='focused'){status.innerHTML='<span class="ok">Selected '+m.name+' in Figma.</span>';return}if(m.json)out.value=m.json;const v=m.validation||[],errs=v.reduce((n,x)=>n+x.errors.length,0),warn=v.reduce((n,x)=>n+x.warnings.length,0);if(m.type==='built'){status.className='';status.innerHTML='<span class="ok">Built '+m.created.length+' variants in '+(m.scope==='all'?'all templates':m.scope)+'.</span>';issues.style.display='none';requestTemplateSets()}else{renderIssues(v);status.innerHTML=`Detected ${m.templates.length} variants in ${m.scope==='all'?'all templates':m.scope} · <span class="${errs?'bad':'ok'}">${errs} errors</span> · ${warn} warnings`}};requestTemplateSets();
</script></body></html>
